# Construye y publica las tres imágenes del campus T28 en GHCR.
#
# El plan completo —por qué existe este fork, cómo se portan los parches de la
# capa de marca y qué verificar— vive en el repo privado del producto:
# `T28-campus`, en `campus/fork/PLAN.md`.
#
# ─── Por qué esto funciona, que es la pregunta que costó contestar ───────────
#
# El fork es PÚBLICO —obligación de la AGPL, no una preferencia— y en repos
# públicos `ubuntu-latest` da 4 vCPU / 16 GB y los minutos son gratis y sin
# medir. Son las mismas condiciones en que upstream construye estas imágenes
# hoy. En un repo privado el mismo runner da 2 vCPU / 7 GB, que es el techo del
# VPS: ahí no entraba, y de ahí venía el bloqueo. Ver PLAN.md §1.
#
# ─── Cuatro decisiones que no son obvias ────────────────────────────────────
#
# 1 · NO hay tag `latest`. Es el que se mueve bajo los pies, y el propio
#     SELF_HOST.md de upstream advierte de eso. El VPS pinnea `sha-<7>`.
#
# 2 · Solo `linux/amd64`. Upstream publica multi-arch con QEMU porque su
#     público es cualquiera; el nuestro es un VPS x86 concreto. Construir arm64
#     por emulación multiplica el tiempo del build —el más caro es justo el del
#     dashboard— para una plataforma que nadie va a usar. Si algún día hace
#     falta, se agrega a `platforms`.
#
# 3 · El smoke test corre ANTES de publicar. Se copia de upstream por una
#     razón: una imagen que compila y no bootea es peor que un build que falla,
#     porque llega al registro y alguien la despliega.
#
# 4 · La caché va al propio GHCR (`type=registry`). Sin ella, cada corrida
#     recompila el dashboard entero.
#
# ─── Lo que este workflow NO hace ───────────────────────────────────────────
#
# No despliega. El VPS hace `pull` cuando se decide, con el sha pinneado a mano
# en el compose. Un push a `main` no puede recrear el campus de un cliente sin
# que nadie lo haya pedido.

name: Construir imágenes del campus

on:
  push:
    branches: [main]
    tags: ['v*']
  # Para poder construir a demanda sin ensuciar la historia con commits vacíos.
  workflow_dispatch:

env:
  REGISTRO: ghcr.io
  # `github.repository` es «owner/repo» en minúsculas — GHCR exige minúsculas.
  NAMESPACE: ${{ github.repository }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1 · Construir y probar que arranca, sin publicar todavía.
  # ───────────────────────────────────────────────────────────────────────────
  humo:
    name: Arranca (${{ matrix.nombre }})
    runs-on: ubuntu-latest
    strategy:
      # Sin fail-fast: si el dashboard falla, igual quiero saber si api y jobs
      # están bien. Con fail-fast cancelaría los otros dos y perdería el dato.
      fail-fast: false
      matrix:
        include:
          - nombre: api
            dockerfile: ./docker/Dockerfile.api
          - nombre: dashboard
            dockerfile: ./docker/Dockerfile.dashboard
          - nombre: jobs
            dockerfile: ./docker/Dockerfile.jobs

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Se carga local (`load: true`) en vez de publicar: la idea es tener la
      # imagen acá para arrancarla antes de que salga del runner.
      - name: Construir ${{ matrix.nombre }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: t28-cio-${{ matrix.nombre }}:prueba
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRO }}/${{ env.NAMESPACE }}/${{ matrix.nombre }}:buildcache
          # `mode=max` cachea también las capas intermedias, que es lo que hace
          # que el build del dashboard no arranque de cero cada vez.
          cache-to: type=registry,ref=${{ env.REGISTRO }}/${{ env.NAMESPACE }}/${{ matrix.nombre }}:buildcache,mode=max

      # Arranca el contenedor y verifica que no se muera solo. No hay base de
      # datos acá, así que no se puede pedir mucho más: lo que se descarta es el
      # fallo que importa —una imagen que ni bootea— y nada más. La verificación
      # de verdad es la del VPS después del `pull` (PLAN.md §5).
      - name: Verificar que bootea
        run: |
          docker run -d --name humo t28-cio-${{ matrix.nombre }}:prueba || true
          sleep 15
          estado=$(docker inspect -f '{{.State.Status}}' humo 2>/dev/null || echo ausente)
          echo "estado: $estado"
          if [ "$estado" = "running" ]; then
            echo "  ✓ ${{ matrix.nombre }} sigue arriba a los 15 s"
          else
            echo "  ✗ ${{ matrix.nombre }} no quedó corriendo — log:"
            docker logs humo 2>&1 | tail -40
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # 2 · Publicar, solo si las tres arrancaron.
  # ───────────────────────────────────────────────────────────────────────────
  publicar:
    name: Publicar (${{ matrix.nombre }})
    needs: humo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lo que habilita empujar a GHCR con el GITHUB_TOKEN de la corrida: no
      # hace falta crear ni rotar un PAT.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: api
            dockerfile: ./docker/Dockerfile.api
          - nombre: dashboard
            dockerfile: ./docker/Dockerfile.dashboard
          - nombre: jobs
            dockerfile: ./docker/Dockerfile.jobs

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Entrar a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRO }}/${{ env.NAMESPACE }}/${{ matrix.nombre }}
          # `sha-<7>` es el que pinnea el VPS. `main` es solo para probar.
          # `vX.Y.Z` sale de los git tags. Deliberadamente sin `latest`.
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Construir y publicar ${{ matrix.nombre }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRO }}/${{ env.NAMESPACE }}/${{ matrix.nombre }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRO }}/${{ env.NAMESPACE }}/${{ matrix.nombre }}:buildcache,mode=max

      # Deja en el resumen de la corrida la línea exacta para pegar en el
      # compose del VPS. Sin esto hay que ir a buscar el sha a mano, que es
      # donde se cuela el error de pinnear una imagen distinta a la probada.
      - name: Qué pinnear en el VPS
        run: |
          {
            echo "### ${{ matrix.nombre }}"
            echo '```yaml'
            echo "    image: ${{ env.REGISTRO }}/${{ env.NAMESPACE }}/${{ matrix.nombre }}:sha-$(echo ${{ github.sha }} | cut -c1-7)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
