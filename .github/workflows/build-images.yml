# Construye y publica las tres imágenes del campus T28 en GHCR.
#
# El plan completo —por qué existe este fork, cómo se portan los parches de la
# capa de marca y qué verificar— vive en el repo privado del producto:
# `T28-campus`, en `campus/fork/PLAN.md`.
#
# ─── Por qué esto funciona, que es la pregunta que costó contestar ───────────
#
# El fork es PÚBLICO —obligación de la AGPL, no una preferencia— y en repos
# públicos `ubuntu-latest` da 4 vCPU / 16 GB y los minutos son gratis y sin
# medir. En un repo privado el mismo runner da 2 vCPU / 7 GB, que es el techo
# del VPS: ahí no entraba, y de ahí venía el bloqueo.
#
# ✅ **Verificado el 25-ago:** el build del dashboard —el pesado— completa en
# **206 s** en este runner, y la aserción de salida de upstream
# (`test -f apps/dashboard/build/index.js`) pasa. El «~8 GB» que bloqueó esto
# durante días era la bandera `--max-old-space-size=8072`, un techo concedido al
# heap, no lo que el build consume.
#
# ─── Un solo job por imagen, y por qué ──────────────────────────────────────
#
# La primera versión de este archivo copiaba la estructura de upstream: un job
# que construye y prueba, y otro que construye de nuevo y publica. Eso son DOS
# builds del dashboard por corrida. Upstream lo paga porque separa permisos
# entre jobs; acá no hace falta.
#
# Un solo job construye con `load`, prueba el arranque y publica reusando la
# caché del mismo builder — el segundo `build-push-action` solo exporta capas.
#
# ⚠ Y ahí estuvo el bug que hizo fallar la primera corrida: el job de prueba
# llevaba `cache-to: type=registry` sin `packages: write` ni login, así que
# exportar la caché daba **403** y se caía el build entero. Upstream usa
# `cache-from` **solo** en su job de prueba, justamente por eso. Con un job
# único con permisos, las dos direcciones de caché son legítimas.
#
# ─── Tres decisiones más ────────────────────────────────────────────────────
#
# 1 · NO hay tag `latest`. Es el que se mueve bajo los pies, y el propio
#     SELF_HOST.md de upstream advierte de eso. El VPS pinnea `sha-<7>`.
#
# 2 · Solo `linux/amd64`. Upstream publica multi-arch con QEMU porque su
#     público es cualquiera; el nuestro es un VPS x86 concreto. Emular arm64
#     multiplicaría el build más caro para una plataforma que nadie va a usar.
#
# 3 · **Sin filtro `paths:`.** Upstream lo usa para no reconstruir en commits de
#     documentación. No se copia a propósito: un filtro que no dispara es
#     silencioso, y este proyecto ya se comió varias veces el fallo de «no hizo
#     nada y pareció exitoso». Minutos gratis, build de 3 minutos: no vale el
#     riesgo.
#
# ─── Lo que este workflow NO hace ───────────────────────────────────────────
#
# No despliega. El VPS hace `pull` cuando se decide, con el sha pinneado a mano
# en el compose. Un push a `main` no puede recrear el campus de un cliente sin
# que nadie lo haya pedido.

name: Construir imágenes del campus

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: imagenes-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRO: ghcr.io
  # `github.repository` es «owner/repo» en minúsculas — GHCR exige minúsculas.
  NAMESPACE: ${{ github.repository }}

jobs:
  imagen:
    name: ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lo que habilita empujar imágenes y caché a GHCR con el GITHUB_TOKEN de
      # la corrida: no hace falta crear ni rotar un PAT.
      packages: write
    strategy:
      # Sin fail-fast: si el dashboard falla, igual quiero saber si api y jobs
      # están bien. Con fail-fast cancelaría los otros dos y perdería el dato.
      fail-fast: false
      matrix:
        include:
          - nombre: api
            dockerfile: ./docker/Dockerfile.api
          - nombre: dashboard
            dockerfile: ./docker/Dockerfile.dashboard
          - nombre: jobs
            dockerfile: ./docker/Dockerfile.jobs

    # El smoke test de upstream (`docker/smoke-test.sh`) corre contra una base
    # efímera: el de `api` ejercita las migraciones, el de `jobs` espera a que
    # los workers reporten, y el de `dashboard` acepta cualquier respuesta que
    # no sea 5xx. Son mucho mejores que «¿sigue vivo a los 15 s?».
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: classroomio
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Entrar a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRO }}/${{ env.NAMESPACE }}/${{ matrix.nombre }}
          # `sha-<7>` es el que pinnea el VPS. `main` es solo para probar.
          # `vX.Y.Z` sale de los git tags. Deliberadamente sin `latest`.
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Se carga local para poder arrancarla acá antes de que salga del runner.
      # `mode=max` cachea también las capas intermedias, que es lo que hace que
      # el build del dashboard no arranque de cero en cada corrida.
      - name: Construir ${{ matrix.nombre }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: t28-cio-${{ matrix.nombre }}:prueba
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRO }}/${{ env.NAMESPACE }}/${{ matrix.nombre }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRO }}/${{ env.NAMESPACE }}/${{ matrix.nombre }}:buildcache,mode=max

      # Script de upstream, sin modificar. Una imagen que compila y no bootea es
      # peor que un build que falla, porque llega al registro y alguien la
      # despliega.
      - name: Probar que arranca
        run: bash docker/smoke-test.sh ${{ matrix.nombre }} t28-cio-${{ matrix.nombre }}:prueba

      # Reusa la caché del builder que ya corrió arriba: esto solo exporta capas
      # al registro, no reconstruye.
      - name: Publicar ${{ matrix.nombre }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRO }}/${{ env.NAMESPACE }}/${{ matrix.nombre }}:buildcache

      # Deja en el resumen de la corrida la línea exacta para pegar en el compose
      # del VPS. Sin esto hay que ir a buscar el sha a mano, que es donde se
      # cuela el error de pinnear una imagen distinta a la probada.
      - name: Qué pinnear en el VPS
        run: |
          {
            echo "### ${{ matrix.nombre }}"
            echo '```yaml'
            echo "    image: ${{ env.REGISTRO }}/${{ env.NAMESPACE }}/${{ matrix.nombre }}:sha-$(echo ${{ github.sha }} | cut -c1-7)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
